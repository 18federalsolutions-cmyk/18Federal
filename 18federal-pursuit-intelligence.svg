<svg xmlns="http://www.w3.org/2000/svg" width="720" height="760" viewBox="0 0 720 760" role="img" aria-labelledby="title desc">
  <title id="title">18Federal pursuit intelligence graphic</title>
  <desc id="desc">Customer, competition, solution, and price intelligence converge into a coordinated federal opportunity strategy and a stronger probability of win.</desc>
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#172d52" stop-opacity=".98"/>
      <stop offset="1" stop-color="#0d203d" stop-opacity=".94"/>
    </linearGradient>
    <linearGradient id="core" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2f70ff"/>
      <stop offset="1" stop-color="#194fc9"/>
    </linearGradient>
    <linearGradient id="outcome" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#18365e"/>
      <stop offset=".55" stop-color="#1c477f"/>
      <stop offset="1" stop-color="#286aff"/>
    </linearGradient>
    <radialGradient id="halo">
      <stop offset="0" stop-color="#3475ff" stop-opacity=".32"/>
      <stop offset=".58" stop-color="#3475ff" stop-opacity=".09"/>
      <stop offset="1" stop-color="#3475ff" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#8eacd6" stroke-opacity=".06"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="28" flood-color="#020b18" flood-opacity=".32"/>
    </filter>
    <filter id="coreGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="11" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0 0 8 4 0 8Z" fill="#5f8fff"/>
    </marker>
  </defs>

  <rect x="18" y="18" width="684" height="724" rx="30" fill="url(#panel)" stroke="#9ab7e5" stroke-opacity=".22" filter="url(#shadow)"/>
  <rect x="18" y="18" width="684" height="724" rx="30" fill="url(#grid)"/>

  <g font-family="Inter, Arial, sans-serif">
    <text x="64" y="75" fill="#8ea4c3" font-size="13" font-weight="700" letter-spacing="3">PURSUIT INTELLIGENCE</text>
    <text x="64" y="110" fill="#ffffff" font-size="25" font-weight="700">Turn insight into a coordinated win strategy.</text>
    <text x="64" y="139" fill="#9eadc3" font-size="14">Four critical inputs. One stronger pursuit position.</text>

    <g fill="none" stroke="#5f8fff" stroke-opacity=".55" stroke-width="2" marker-end="url(#arrow)">
      <path d="M208 239 C263 239 270 303 306 331"/>
      <path d="M512 239 C457 239 450 303 414 331"/>
      <path d="M208 469 C263 469 270 405 306 377"/>
      <path d="M512 469 C457 469 450 405 414 377"/>
    </g>

    <g transform="translate(64 190)">
      <rect width="160" height="98" rx="17" fill="#182f54" fill-opacity=".86" stroke="#8ba8d3" stroke-opacity=".26"/>
      <circle cx="30" cy="30" r="13" fill="#2d6fff" fill-opacity=".18" stroke="#6d99ff" stroke-opacity=".7"/>
      <circle cx="30" cy="27" r="4" fill="#8db0ff"/><path d="M22 38c2-6 14-6 16 0" fill="none" stroke="#8db0ff" stroke-width="2" stroke-linecap="round"/>
      <text x="52" y="34" fill="#ffffff" font-size="17" font-weight="700">Customer</text>
      <text x="22" y="68" fill="#9eadc3" font-size="13">Mission • priorities</text>
      <text x="22" y="86" fill="#9eadc3" font-size="13">buying signals</text>
    </g>

    <g transform="translate(496 190)">
      <rect width="160" height="98" rx="17" fill="#182f54" fill-opacity=".86" stroke="#8ba8d3" stroke-opacity=".26"/>
      <circle cx="30" cy="30" r="13" fill="#2d6fff" fill-opacity=".18" stroke="#6d99ff" stroke-opacity=".7"/>
      <path d="M23 34h14M25 30h10M28 26h4" stroke="#8db0ff" stroke-width="2" stroke-linecap="round"/>
      <text x="52" y="34" fill="#ffffff" font-size="17" font-weight="700">Competition</text>
      <text x="22" y="68" fill="#9eadc3" font-size="13">Incumbent • rivals</text>
      <text x="22" y="86" fill="#9eadc3" font-size="13">likely positioning</text>
    </g>

    <g transform="translate(64 420)">
      <rect width="160" height="98" rx="17" fill="#182f54" fill-opacity=".86" stroke="#8ba8d3" stroke-opacity=".26"/>
      <circle cx="30" cy="30" r="13" fill="#2d6fff" fill-opacity=".18" stroke="#6d99ff" stroke-opacity=".7"/>
      <path d="m23 31 5 5 10-12" fill="none" stroke="#8db0ff" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="52" y="34" fill="#ffffff" font-size="17" font-weight="700">Solution</text>
      <text x="22" y="68" fill="#9eadc3" font-size="13">Discriminators • proof</text>
      <text x="22" y="86" fill="#9eadc3" font-size="13">delivery confidence</text>
    </g>

    <g transform="translate(496 420)">
      <rect width="160" height="98" rx="17" fill="#182f54" fill-opacity=".86" stroke="#8ba8d3" stroke-opacity=".26"/>
      <circle cx="30" cy="30" r="13" fill="#2d6fff" fill-opacity=".18" stroke="#6d99ff" stroke-opacity=".7"/>
      <text x="30" y="35" text-anchor="middle" fill="#8db0ff" font-size="15" font-weight="700">$</text>
      <text x="52" y="34" fill="#ffffff" font-size="17" font-weight="700">Price</text>
      <text x="22" y="68" fill="#9eadc3" font-size="13">Price-to-win • risk</text>
      <text x="22" y="86" fill="#9eadc3" font-size="13">competitive range</text>
    </g>

    <circle cx="360" cy="354" r="138" fill="url(#halo)"/>
    <circle cx="360" cy="354" r="91" fill="none" stroke="#6090ff" stroke-opacity=".17"/>
    <circle cx="360" cy="354" r="69" fill="none" stroke="#6090ff" stroke-opacity=".28" stroke-dasharray="4 7"/>
    <circle cx="360" cy="354" r="51" fill="url(#core)" stroke="#a9c2ff" stroke-opacity=".72" filter="url(#coreGlow)"/>
    <circle cx="360" cy="354" r="30" fill="none" stroke="#ffffff" stroke-opacity=".34"/>
    <circle cx="360" cy="354" r="8" fill="#ffffff"/>
    <text x="360" y="431" text-anchor="middle" fill="#ffffff" font-size="16" font-weight="700">OPPORTUNITY</text>
    <text x="360" y="452" text-anchor="middle" fill="#9fb4d2" font-size="12" font-weight="600" letter-spacing="1.4">COORDINATED STRATEGY</text>

    <g transform="translate(64 558)">
      <rect width="592" height="72" rx="18" fill="#102543" stroke="#8da9d2" stroke-opacity=".22"/>
      <text x="22" y="27" fill="#8fa4c2" font-size="11" font-weight="700" letter-spacing="1.5">PROBABILITY OF WIN</text>
      <rect x="22" y="42" width="394" height="8" rx="4" fill="#29415f"/>
      <rect x="22" y="42" width="300" height="8" rx="4" fill="#3475ff"/>
      <circle cx="322" cy="46" r="7" fill="#8fb1ff"/>
      <text x="548" y="45" text-anchor="end" fill="#ffffff" font-size="27" font-weight="750">↑ Pwin</text>
    </g>

    <g transform="translate(64 652)">
      <rect width="592" height="58" rx="16" fill="url(#outcome)" stroke="#8cb0ff" stroke-opacity=".48"/>
      <circle cx="30" cy="29" r="12" fill="#ffffff" fill-opacity=".13"/>
      <path d="m24 29 4 4 8-9" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="54" y="35" fill="#b9cdf2" font-size="12" font-weight="700" letter-spacing="1.7">OUTPUT</text>
      <text x="556" y="36" text-anchor="end" fill="#ffffff" font-size="20" font-weight="750">WINNING PROPOSAL</text>
    </g>
  </g>
</svg>
